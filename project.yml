name: car
options:
  bundleIdPrefix: com.car
  deploymentTarget:
    macOS: "26.0"
packages:
  CarKit:
    path: CarKit
targets:
  car:
    type: application
    platform: macOS
    sources:
      - App
      # `car guide` prints it.
      - path: docs/guide.md
        buildPhase: resources
    dependencies:
      - package: CarKit
    info:
      path: App/Info.plist
      properties:
        # Starts in the menu bar alone; while one of its windows is open it is
        # in the Dock too (Windows.swift switches it).
        LSUIElement: true
        # car, or car-dev for the development copy (build.sh sets PRODUCT_NAME).
        CFBundleDisplayName: $(PRODUCT_NAME)
        NSHumanReadableCopyright: ""
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: "car records your voice for as long as a session you start runs."
        # Finder's selection and a browser's front tab are read with Apple
        # events when the accessibility tree does not carry them.
        NSAppleEventsUsageDescription: "car asks Finder which files you have selected and a browser which page is open, so a session can say what was in front of you."
    entitlements:
      path: App/car.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Hardened runtime gates the microphone and Apple events behind these
        # even for an unsandboxed app; without them macOS denies rather than
        # prompts and the app never appears in the privacy pane.
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: car
        PRODUCT_BUNDLE_IDENTIFIER: com.car.mac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # build.sh passes the commit it was built from.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
